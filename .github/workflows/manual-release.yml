name: Manual Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sing_quic_ref: ${{ steps.dependencies.outputs.sing_quic_ref }}
      sing_snell_ref: ${{ steps.dependencies.outputs.sing_snell_ref }}
      sing_dns_ref: ${{ steps.dependencies.outputs.sing_dns_ref }}
      quinn_ref: ${{ steps.dependencies.outputs.quinn_ref }}
      rustls_ref: ${{ steps.dependencies.outputs.rustls_ref }}
    steps:
      - name: Checkout sing-box-rs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: sing-box-rs
          persist-credentials: false

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          version="$(awk '
            $0 == "[workspace.package]" { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*/, "", value)
              gsub(/"/, "", value)
              print value
              exit
            }
          ' sing-box-rs/Cargo.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing workspace version: $version" >&2
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          {
            echo "### Manual release"
            echo ""
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin workspace dependency commits
        id: dependencies
        shell: bash
        run: |
          resolve_master() {
            local repository="$1"
            local output_name="$2"
            local sha
            sha="$(git ls-remote "https://github.com/happytrudy/$repository.git" refs/heads/master | awk '{print $1}')"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve happytrudy/$repository master" >&2
              exit 1
            fi
            echo "$output_name=$sha" >> "$GITHUB_OUTPUT"
            echo "- happytrudy/$repository: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### Pinned workspace dependencies"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          resolve_master sing-quic-rs sing_quic_ref
          resolve_master sing-snell-rs sing_snell_ref
          resolve_master sing-dns-rs sing_dns_ref
          resolve_master quinn quinn_ref
          resolve_master rustls rustls_ref

  verify:
    name: Test release source
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sing-box-rs
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: sing-box-rs
          persist-credentials: false

      - name: Checkout workspace dependencies
        uses: ./sing-box-rs/.github/actions/checkout-workspace-dependencies
        with:
          sing_quic_ref: ${{ needs.metadata.outputs.sing_quic_ref }}
          sing_snell_ref: ${{ needs.metadata.outputs.sing_snell_ref }}
          sing_dns_ref: ${{ needs.metadata.outputs.sing_dns_ref }}
          quinn_ref: ${{ needs.metadata.outputs.quinn_ref }}
          rustls_ref: ${{ needs.metadata.outputs.rustls_ref }}

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Run workspace tests
        working-directory: sing-box-rs
        run: cargo test --workspace

      - name: Run strict clippy
        working-directory: sing-box-rs
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - metadata
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout sing-box-rs
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: sing-box-rs
          persist-credentials: false

      - name: Checkout workspace dependencies
        uses: ./sing-box-rs/.github/actions/checkout-workspace-dependencies
        with:
          sing_quic_ref: ${{ needs.metadata.outputs.sing_quic_ref }}
          sing_snell_ref: ${{ needs.metadata.outputs.sing_snell_ref }}
          sing_dns_ref: ${{ needs.metadata.outputs.sing_dns_ref }}
          quinn_ref: ${{ needs.metadata.outputs.quinn_ref }}
          rustls_ref: ${{ needs.metadata.outputs.rustls_ref }}

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        working-directory: sing-box-rs
        run: cargo build --release --package sing-box-rs --target "${{ matrix.target }}"

      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          package="sing-box-rs-$TAG-$PLATFORM"
          mkdir -p "staging/$package" dist
          install -m 0755 \
            "sing-box-rs/target/$TARGET/release/sing-box-rs" \
            "staging/$package/sing-box-rs"
          cp sing-box-rs/README.md "staging/$package/"
          cp sing-box-rs/ARCHITECTURE.md "staging/$package/"
          cp -R sing-box-rs/examples "staging/$package/"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "target=$TARGET"
            echo "sing-box-rs=$(git -C sing-box-rs rev-parse HEAD)"
            echo "sing-quic-rs=$(git -C sing-quic-rs rev-parse HEAD)"
            echo "sing-snell-rs=$(git -C sing-snell-rs rev-parse HEAD)"
            echo "sing-dns-rs=$(git -C sing-dns-rs rev-parse HEAD)"
            echo "quinn=$(git -C quinn rev-parse HEAD)"
            echo "rustls=$(git -C rustls rev-parse HEAD)"
          } > "staging/$package/BUILD-INFO.txt"

          tar -C staging -czf "dist/$package.tar.gz" "$package"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update release
        shell: bash
        env:
          DRAFT: ${{ inputs.draft }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$REPOSITORY/git/refs/tags/$TAG" \
              --raw-field sha="$GITHUB_SHA" \
              --field force=true \
              >/dev/null
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$REPOSITORY"
            gh release edit "$TAG" \
              --repo "$REPOSITORY" \
              --title "sing-box-rs $TAG" \
              --draft="$DRAFT" \
              --prerelease="$PRERELEASE"
            echo "Replaced $TAG with artifacts built from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          args=(
            release create "$TAG"
            "${assets[@]}"
            --repo "$REPOSITORY"
            --target "$GITHUB_SHA"
            --title "sing-box-rs $TAG"
            --generate-notes
          )
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"
